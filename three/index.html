<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Numberics Three</title>
<meta name="description" content="Count in threes. Every swipe moves tiles one step; 1 and 2 make 3, neighbouring multiples of 3 merge, and a rainbow run of 3-6-9 flushes for big points and a power-up.">
<meta name="theme-color" content="#14151c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314151c'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' font-family='sans-serif' font-weight='700' fill='%23f2b84b'%3E3%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header>
    <div class="brand">
      <h1>Three</h1>
      <p class="sub"><a href="../">Numberics</a> &middot; count in threes</p>
    </div>
    <div class="stats" aria-live="off">
      <div class="stat"><span>Score</span><b id="score">0</b></div>
      <div class="stat"><span>Best</span><b id="best">0</b></div>
      <div class="stat next"><span>Next</span><b id="next" class="mini" aria-label="next tile"></b></div>
    </div>
  </header>

  <section id="tray" class="tray" aria-label="Power-ups"></section>
  <p id="hint" class="hint" role="status"></p>

  <div id="board" class="board" tabindex="0" aria-label="Game board. Arrow keys or swipe to move every tile one step.">
    <div id="cells" class="cells"></div>
    <div id="tiles" class="tiles"></div>
    <div id="over" class="over" hidden>
      <h2>No moves left</h2>
      <p id="over-text"></p>
      <button id="again" class="btn primary" type="button">New game</button>
    </div>
  </div>

  <div class="row">
    <button id="new" class="btn" type="button">New game</button>
  </div>
  <p class="how">Swipe or use the arrow keys: every tile moves one step. 1 and 2 make 3; equal or neighbouring
     multiples of 3 merge. Line up 3, 6, 9 to Flush it for points and a power-up.</p>
  <nav id="games" class="games" data-root="../" data-current="three" aria-label="Numberics games"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>
<script src="../shared/kit.js"></script>
<script src="../shared/power.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>
<script src="../shared/nav.js"></script>
</body>
</html>
