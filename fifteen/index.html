<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Numberics Fifteen</title>
<meta name="description" content="Take turns claiming the numbers 1 to 9. The first to hold three that add up to 15 wins. Best of five against the computer.">
<meta name="theme-color" content="#14151c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314151c'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' font-family='sans-serif' font-weight='700' fill='%23f2b84b'%3E15%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header>
    <div class="brand">
      <h1>Fifteen</h1>
      <p class="sub">Three numbers, fifteen exactly.</p>
    </div>
    <div class="stats" aria-live="off">
      <div class="stat"><span>You</span><b id="you">0</b></div>
      <div class="stat"><span>Computer</span><b id="cpu">0</b></div>
      <div class="stat"><span>Round</span><b id="round">1/5</b></div>
    </div>
  </header>

  <div id="diff" class="seg" role="group" aria-label="Difficulty"></div>

  <section id="tray" class="tray" aria-label="Power-ups"></section>
  <p id="hint" class="hint" role="status"></p>

  <div id="board" class="board" tabindex="0" aria-label="The numbers 1 to 9. Arrow keys move, Enter claims.">
    <div id="hash" class="hash" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div id="tiles" class="tiles"></div>
    <div id="over" class="over" hidden>
      <h2 id="over-title">Match over</h2>
      <p id="over-text"></p>
      <button id="again" class="btn primary" type="button">New match</button>
    </div>
  </div>

  <div class="row">
    <div class="views" role="group" aria-label="View">
      <button id="v-numbers" class="btn" type="button" aria-pressed="true">Numbers</button>
      <button id="v-grid" class="btn" type="button" aria-pressed="false">Grid</button>
    </div>
    <button id="next" class="btn primary" type="button" hidden>Next round</button>
    <button id="new" class="btn" type="button">New match</button>
  </div>
  <p class="how">Take turns claiming numbers. Hold any three that add up to 15 to win the round; best of five.
     Each round you win earns a power-up. Keys: arrows and Enter, V switches view, 1-4 power-ups.</p>
  <nav id="games" class="games" data-root="../" data-current="fifteen" aria-label="Numberics games"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>
<script src="../shared/kit.js"></script>
<script src="../shared/power.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>
<script src="../shared/nav.js"></script>
</body>
</html>
