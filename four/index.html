<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Numberics Four</title>
<meta name="description" content="Connect Four with numbered discs: win with four of your colour in a row, or any four in a row that sum to exactly ten.">
<meta name="theme-color" content="#14151c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314151c'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' font-family='sans-serif' font-weight='700' fill='%23f2b84b'%3E4%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header>
    <div class="brand">
      <h1>Four</h1>
      <p class="sub"><a href="../">Numberics</a> &middot; <span id="rec">count to ten</span></p>
    </div>
    <div class="stats" aria-live="off">
      <div class="stat"><span>Next</span><b id="next" class="mini you" aria-label="your next disc"></b></div>
      <div class="stat"><span>Held</span><b id="held" class="mini you" aria-label="your held disc"></b></div>
      <div class="stat"><span>CPU</span><b id="cnext" class="mini cpu" aria-label="the computer's next disc"></b></div>
    </div>
  </header>

  <div id="levels" class="seg" role="group" aria-label="Difficulty">
    <button type="button" data-level="easy">Easy</button>
    <button type="button" data-level="medium">Medium</button>
    <button type="button" data-level="hard">Hard</button>
  </div>

  <section id="tray" class="tray" aria-label="Power-ups"></section>
  <p id="hint" class="hint" role="status"></p>

  <div id="board" class="board four" tabindex="0" aria-label="Game board, 7 columns. Left and right arrows pick a column, Enter or Down drops your disc.">
    <div id="grid" class="grid"></div>
    <div id="over" class="over" hidden>
      <h2 id="over-title">You win</h2>
      <p id="over-text"></p>
      <button id="again" class="btn primary" type="button">New game</button>
    </div>
  </div>

  <div class="row"><button id="new" class="btn" type="button">New game</button></div>
  <p class="how">Tap a column, or use the arrows and Enter, to drop your next disc. Win with four of your colour in a row,
     or any four in a row, any colours, that add up to exactly 10. Block a line of three or set up a ten to earn power-ups.</p>
  <nav id="games" class="games" data-root="../" data-current="four" aria-label="Numberics games"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>
<script src="../shared/kit.js"></script>
<script src="../shared/power.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>
<script src="../shared/nav.js"></script>
</body>
</html>
