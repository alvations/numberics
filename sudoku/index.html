<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Numberics Sudoku</title>
<meta name="description" content="Classic Sudoku with pencil notes, undo, hints and three difficulties. Every puzzle has exactly one solution.">
<meta name="theme-color" content="#14151c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314151c'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' font-family='sans-serif' font-weight='700' fill='%23f2b84b'%3E9%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header>
    <div class="brand">
      <h1>Sudoku</h1>
      <p class="sub"><a href="../">Numberics</a> &middot; <span id="diff-label"></span></p>
    </div>
    <div class="stats">
      <div class="stat"><span>Time</span><b id="time">0:00</b></div>
      <div class="stat"><span>Best</span><b id="best">-</b></div>
    </div>
  </header>

  <div class="levels" id="levels" role="group" aria-label="Difficulty"></div>

  <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>

  <div class="tools">
    <button id="notes" class="btn" type="button" aria-pressed="false">Notes: off</button>
    <button id="undo" class="btn" type="button">Undo</button>
    <button id="erase" class="btn" type="button">Erase</button>
    <button id="hint" class="btn" type="button">Hint</button>
  </div>
  <div id="pad" class="pad" role="group" aria-label="Number pad"></div>

  <div class="row"><button id="new" class="btn" type="button">New puzzle</button></div>
  <p class="how">Fill every row, column and 3x3 box with 1 to 9. Keys: 1-9 place, Backspace erase, N notes,
     U undo, H hint, arrows move. Every puzzle has exactly one solution.</p>

  <div id="win" class="win" hidden role="dialog" aria-label="Solved">
    <h2>Solved</h2>
    <p id="win-text"></p>
    <button id="again" class="btn primary" type="button">New puzzle</button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>
<script src="engine.js"></script>
<script src="game.js"></script>
</body>
</html>
