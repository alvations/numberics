<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Numberics Sudoku</title>
<meta name="description" content="Classic Sudoku with pencil notes, free undo, earned power-ups and three difficulties. Every puzzle has exactly one solution.">
<meta name="theme-color" content="#14151c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314151c'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' font-family='sans-serif' font-weight='700' fill='%23f2b84b'%3E9%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header>
    <div class="brand">
      <h1>Sudoku</h1>
      <p class="sub"><a href="../">Numberics</a> &middot; One answer only.</p>
    </div>
    <div class="stats">
      <div class="stat"><span>Time</span><b id="time">0:00</b></div>
      <div class="stat"><span>Best</span><b id="best" class="none">none</b></div>
    </div>
  </header>

  <div class="levels" id="levels" role="group" aria-label="Difficulty"></div>

  <div class="wrap">
    <div id="board" class="board" role="grid" tabindex="0" aria-label="Sudoku board"></div>
    <div id="win" class="over" hidden role="dialog" aria-label="Solved">
      <h2>Solved</h2>
      <p id="win-text"></p>
      <p id="win-best" class="best" hidden></p>
      <div class="row">
        <button id="win-view" class="btn" type="button">See the board</button>
        <button id="again" class="btn primary" type="button">New puzzle</button>
      </div>
    </div>
  </div>

  <section id="tray" class="tray" aria-label="Power-ups"></section>
  <div class="tools">
    <button id="notes" class="btn" type="button" aria-pressed="false">Notes: off</button>
    <button id="erase" class="btn" type="button">Erase</button>
  </div>
  <div id="pad" class="pad" role="group" aria-label="Number pad"></div>

  <div class="row"><button id="new" class="btn" type="button">New puzzle</button></div>
  <p class="how">Fill every row, column and 3x3 box with 1 to 9. Keys: 1-9, arrows, Backspace, N notes, U undo,
     H reveal, C check, F candidates. Every 9 cells with no clash earns a power-up.</p>

  <nav id="games" class="games" data-root="../" data-current="sudoku" aria-label="Numberics games"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>
<script src="../shared/kit.js"></script>
<script src="../shared/power.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>
<script src="../shared/nav.js"></script>
</body>
</html>
