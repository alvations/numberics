<!-- Prototype for docs/design/REDESIGN.md section 5.5: discs that fall with gravity and settle, on the new tokens.
     Tap a column (or press 1-7) to drop. ?motion=reduced shows the reduced path. Self-contained. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numberics Four (prototype)</title>
<style>
:root{ --bg:#12131a; --bg-glow:#1b1d2b; --panel:#1c1f2c; --cell:#2a2e41; --board:#1c1f2c; --board-cell:#131520; --line:#33384f;
  --ink:#f2f1f7; --mute:#a5a7bd; --accent:#f5bd4f; --accent-2:#ffd27a; --cool:#74b9ff; --cool-2:#a6d2ff; --tile-ink:#16161e;
  --r-lg:22px; --gap:10px; --fs-sm:.875rem; --e-fall:cubic-bezier(.55,0,1,.45); --e-out:cubic-bezier(.2,.8,.2,1); }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100dvh; color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(120% 60% at 50% -10%, var(--bg-glow), var(--bg) 60%) fixed; padding:24px 16px; display:flex; justify-content:center; }
#app{ width:100%; max-width:480px; }
h1{ margin:0; font-size:2.25rem; color:var(--accent); font-weight:850; }
.sub{ margin:2px 0 14px; color:var(--mute); font-size:var(--fs-sm); }
.board{ position:relative; width:100%; aspect-ratio:7/6; background:var(--board); border-radius:var(--r-lg); padding:var(--gap);
  box-shadow:0 8px 24px rgba(0,0,0,.35), inset 0 0 0 1px var(--line); container-type:size; overflow:hidden; cursor:pointer; }
.grid{ position:absolute; inset:var(--gap); display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:repeat(6,1fr); gap:calc(var(--gap)*.7); }
.slot{ position:relative; background:var(--board-cell); border-radius:50%; box-shadow:inset 0 3px 6px rgba(0,0,0,.45); }
.disc{ position:absolute; inset:6%; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:850; font-size:8cqw;
  color:var(--tile-ink); font-variant-numeric:tabular-nums; z-index:1;
  background:radial-gradient(circle at 35% 30%, var(--hi), var(--own) 62%); box-shadow:inset 0 -1cqw 0 rgba(0,0,0,.2), 0 .6cqw 1.2cqw rgba(0,0,0,.35); }
.disc.p1{ --own:var(--accent); --hi:var(--accent-2); } .disc.p2{ --own:var(--cool); --hi:var(--cool-2); }
.disc.win{ box-shadow:0 0 0 .7cqw var(--ink), inset 0 -1cqw 0 rgba(0,0,0,.2); }
.hint{ min-height:1.45em; margin:12px 0; color:var(--accent); font-weight:600; font-size:var(--fs-sm); text-align:center; }
</style>
</head>
<body>
<main id="app">
  <h1>Four</h1><p class="sub">Four in a row, or four that make ten.</p>
  <div class="board" id="board"><div class="grid" id="grid"></div></div>
  <p class="hint" id="hint">Tap a column to drop your disc.</p>
</main>
<script>
var q = new URLSearchParams(location.search), reduced = q.get("motion") === "reduced";
try { if (!q.get("motion") && matchMedia("(prefers-reduced-motion: reduce)").matches) reduced = true; } catch (e) {}
var grid = document.getElementById("grid"), slots = [];
for (var r = 0; r < 6; r++) for (var c = 0; c < 7; c++) { var s = document.createElement("div"); s.className = "slot"; grid.appendChild(s); slots.push(s); }
var h = [0,0,0,0,0,0,0], turn = 1, n = [2,1,3,1,4,1,2,1,1,3];
// fall time grows with the square root of the distance (gravity), then a short squash-and-settle on landing
function fallMs(rows) { return Math.round(70 + 60 * Math.sqrt(rows)); }
function drop(col) {
  if (h[col] >= 6) return;
  var row = 5 - h[col]; h[col]++;
  var d = document.createElement("div"); d.className = "disc p" + turn; d.textContent = n[(row * 7 + col) % n.length];
  slots[row * 7 + col].appendChild(d);
  var rows = row + 1; // from one slot above the board to its landing row
  if (reduced) { d.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 120, easing: "linear" }); }
  else {
    var pitch = d.parentNode.offsetHeight + parseFloat(getComputedStyle(grid).rowGap); // one slot plus one gap, in px
    var t = fallMs(rows);
    d.animate([{ transform: "translateY(" + (-rows * pitch) + "px)" }, { transform: "translateY(0)" }], { duration: t, easing: "cubic-bezier(.55,0,1,.45)" });
    d.animate([{ transform: "scale(1,1)" }, { transform: "scale(1.08,.9) translateY(4%)", offset: .35 }, { transform: "scale(.97,1.03)", offset: .7 }, { transform: "scale(1,1)" }],
      { duration: 160, delay: t, easing: "cubic-bezier(.2,.8,.2,1)", composite: "add" });
  }
  turn = 3 - turn;
}
document.getElementById("board").addEventListener("click", function (e) {
  var b = grid.getBoundingClientRect(); drop(Math.max(0, Math.min(6, Math.floor((e.clientX - b.left) / b.width * 7))));
});
document.addEventListener("keydown", function (e) { var k = +e.key; if (k >= 1 && k <= 7) drop(k - 1); });
[3,3,2,4,2,1,4,5,3,2,0,6].forEach(function (c) { h[c] < 6 && (function () { var rr = reduced; reduced = true; drop(c); reduced = rr; })(); });
window.__drop = drop;
</script>
</body>
</html>
