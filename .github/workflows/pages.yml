# Publish Numberics to GitHub Pages: the stable site from main at the root, and the redesign beta from
# build/v2 at /beta/ (owner, 21 Nov). Runs on a push to either branch; each branch's unit tests must pass.
# Pages serves the gh-pages branch, rebuilt here from both. Commits carry the owner's identity (CLAUDE.md).
# The beta keeps its own storage namespace (shared/boot.js), so it never touches stable players' progress.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, build/v2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (stable)
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
          fetch-depth: 0
      - name: Check out build/v2 (beta)
        uses: actions/checkout@v4
        with:
          ref: build/v2
          path: beta
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests, stable
        run: cd stable && node tests/run.js
      - name: Unit tests and storage guard, beta (a failing beta never blocks stable; it is just not published)
        id: beta
        continue-on-error: true
        run: |
          cd beta
          grep -q "numberics_beta_" shared/boot.js || { echo "beta has no storage namespace yet: not publishing it"; exit 1; }
          node tests/run.js
      - name: Assemble the site (stable at /, beta at /beta/; only what the pages load)
        run: |
          # every root-level page, style, script and data file of either layout (Two at the root on main today; the
          # games page with home.css on build/v2, O-9), so a new root file never 404s whichever branch's copy runs
          assemble () {
            src="$1"; out="$2"; mkdir -p "$out"
            for f in "$src"/*.html "$src"/*.css "$src"/*.js "$src"/games.json "$src"/.nojekyll "$src"/LICENSE "$src"/NOTICE; do
              [ -e "$f" ] && cp -r "$f" "$out/"
            done
            cp -r "$src/shared" "$src/screenshots" "$out/"
            [ -d "$src/two" ] && cp -r "$src/two" "$out/"
            for p in $(cd "$src" && node -e 'require("./games.json").filter(g => g.status === "live" && g.path).forEach(g => console.log(g.path))'); do
              cp -r "$src/$p" "$out/"
            done
            return 0
          }
          assemble stable _site
          if [ "${{ steps.beta.outcome }}" = "success" ]; then
            assemble beta _site/beta
          else
            # a failing beta is not published, but the beta already live stays live (critic R5 S1)
            echo "beta failed its tests: keeping the published beta"
            if git clone -q --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" old \
              && [ -d old/beta ]; then cp -r old/beta _site/beta; fi
          fi
      - name: Publish to gh-pages
        run: |
          s=$(git -C stable rev-parse --short HEAD); b=$(git -C beta rev-parse --short HEAD)
          if [ "${{ steps.beta.outcome }}" = "success" ]; then bl="beta from build/v2 $b"; else bl="beta kept (build/v2 $b failed its tests)"; fi
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name=alvations -c user.email=alvations@gmail.com commit -q -m "Publish Numberics: stable from main $s, $bl"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
