# Publish Numberics to GitHub Pages on every push to main, after the engine tests pass.
# Pages serves the gh-pages branch; this job rebuilds that branch from main (static site, no build step).
# Commits on gh-pages carry the owner's identity (CLAUDE.md: authorship is the owner's only).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (every game)
        run: node tests/run.js
      - name: Assemble the site (only what the pages load; live games from games.json)
        run: |
          mkdir -p _site
          cp -r index.html engine.js game.js style.css games.json .nojekyll shared two screenshots LICENSE NOTICE _site/   # two/: the alias page for Two (REDESIGN.md 3.1)
          for p in $(node -e 'require("./games.json").filter(g => g.status === "live" && g.path).forEach(g => console.log(g.path))'); do
            cp -r "$p" _site/
          done
      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name=alvations -c user.email=alvations@gmail.com commit -q -m "Publish Numberics (site from main ${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
